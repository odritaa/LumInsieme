services:
  postgres:
    image: postgres:16-alpine
    container_name: luminsieme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luminsieme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en el .env de la raiz}
      POSTGRES_DB: ${POSTGRES_DB:-luminsieme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/login-controller/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luminsieme} -d ${POSTGRES_DB:-luminsieme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  login-controller:
    build: ./src/login-controller
    container_name: luminsieme-login
    restart: unless-stopped
    env_file:
      - ./src/login-controller/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-luminsieme}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luminsieme}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: luminsieme-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache-controller:
    build: ./src/cache-controller
    container_name: luminsieme-cache
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-controller:
    build:
      context: ./src
      dockerfile: chat-controller/Dockerfile
    container_name: luminsieme-chat
    restart: unless-stopped
    environment:
      PORT: "3000"
      CACHE_GRPC_ADDR: cache-controller:50051
    ports:
      - "3000:3000"
    depends_on:
      cache-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scrapper:
    build: ./src/scrapper
    container_name: luminsieme-scrapper
    profiles:
      - scrapper
    restart: "no"
    environment:
      GRPC_HOST: cache-controller
      GRPC_PORT: "50051"
      CACHE_TTL: ${CACHE_TTL:-3600}
      SCRAPPING_DAYS: ${SCRAPPING_DAYS:-5}
    depends_on:
      cache-controller:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
