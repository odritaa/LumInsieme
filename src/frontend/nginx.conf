server {
    listen 80;
    server_name _;

    # certbot resuelve el challenge HTTP-01 por el puerto 80: tiene que quedar
    # exento del redirect a HTTPS o la emision del certificado falla.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /scrape/ {
        proxy_pass http://localhost:8000/scrape/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # login-controller es el nombre del servicio en docker-compose, no localhost.
    location /auth/ {
        proxy_pass http://login-controller:4000/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
