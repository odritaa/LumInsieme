# HSTS se omite en localhost: el navegador lo aplicaria tambien a http://localhost:5173 (Vite).
map $host $lum_hsts {
    localhost "";
    127.0.0.1 "";
    default   "max-age=31536000; includeSubDomains";
}

# Perfil, salas y tickets de chat son datos personales: que ningun cache intermedio los guarde.
map $request_uri $lum_cache_control {
    ~^/(auth|salas)(/|\?|$) "no-store";
    default                 "";
}

server_tokens off;

server {
    listen 80;
    server_name _;

    # certbot resuelve el challenge HTTP-01 por el puerto 80: tiene que quedar
    # exento del redirect a HTTPS o la emision del certificado falla.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Ninguna location define add_header propio: todas heredan estas cabeceras.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security $lum_hsts always;
    add_header Cache-Control $lum_cache_control always;
    proxy_hide_header X-Powered-By;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # login-controller, reunion-controller y chat-controller son nombres de servicio de docker-compose.
    location /auth/ {
        proxy_pass http://login-controller:4000/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(cartelera|salas)(/|$) {
        proxy_pass http://reunion-controller:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://chat-controller:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 1h;
    }
}
