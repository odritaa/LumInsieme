<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Grupal - Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

    #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 12px; }
    #login input { padding: 10px 16px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #eee; width: 260px; font-size: 14px; }
    #login button { padding: 10px 16px; border-radius: 8px; border: none; background: #e94560; color: #fff; width: 260px; font-size: 14px; cursor: pointer; }
    #login button:hover { background: #c73652; }

    #chat { display: none; flex-direction: column; height: 100vh; }
    #header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #333; font-weight: bold; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #16213e; padding: 10px 14px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: #0f3460; }
    .msg .user { font-size: 11px; color: #e94560; margin-bottom: 4px; }
    .msg.me .user { color: #53a8ff; }
    .msg .text { font-size: 14px; }
    .msg .time { font-size: 10px; color: #888; margin-top: 4px; text-align: right; }
    #input-bar { display: flex; padding: 12px; background: #16213e; border-top: 1px solid #333; gap: 8px; }
    #input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #1a1a2e; color: #eee; font-size: 14px; }
    #input-bar button { padding: 10px 20px; border-radius: 8px; border: none; background: #e94560; color: #fff; font-size: 14px; cursor: pointer; }
    #input-bar button:hover { background: #c73652; }
  </style>
</head>
<body>
  <div id="login">
    <h2>Chat Grupal LumInsieme</h2>
    <input id="username" type="text" placeholder="Tu nombre de usuario">
    <input id="event_id" type="text" placeholder="ID del evento">
    <button onclick="connect()">Entrar al chat</button>
  </div>

  <div id="chat">
    <div id="header"></div>
    <div id="messages"></div>
    <div id="input-bar">
      <input id="msg-input" type="text" placeholder="Escribí tu mensaje..." autocomplete="off">
      <button onclick="send()">Enviar</button>
    </div>
  </div>

  <script>
    let ws;
    let username;

    function connect() {
      username = document.getElementById("username").value.trim();
      const eventId = document.getElementById("event_id").value.trim();
      if (!username || !eventId) return alert("Completá ambos campos");

      const host = location.hostname || "localhost";
      ws = new WebSocket(`ws://${host}:3000?event_id=${eventId}&username=${username}`);

      ws.onopen = () => {
        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "flex";
        document.getElementById("header").textContent = `Evento: ${eventId}`;
        document.getElementById("msg-input").focus();
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "history") {
          data.payload.forEach((m) => addMessage(m, false));
        } else if (data.type === "message") {
          addMessage(data.payload, true);
        }
      };

      ws.onclose = () => addSystemMessage("Desconectado del servidor");

      document.getElementById("msg-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });
    }

    function send() {
      const input = document.getElementById("msg-input");
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ content }));
      input.value = "";
    }

    function addMessage(msg, scroll) {
      const div = document.createElement("div");
      div.className = "msg" + (msg.username === username ? " me" : "");
      const time = new Date(msg.timestamp).toLocaleTimeString("es-AR");
      div.innerHTML = `<div class="user">${msg.username}</div><div class="text">${escapeHtml(msg.content)}</div><div class="time">${time}</div>`;
      document.getElementById("messages").appendChild(div);
      if (scroll !== false) div.scrollIntoView({ behavior: "smooth" });
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<div class="text" style="color:#888;font-style:italic">${text}</div>`;
      document.getElementById("messages").appendChild(div);
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
